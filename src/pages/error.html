<!DOCTYPE html>
<html>
<head>
  <title>Bitmap Redirect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffa550 0%, #c97a2b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #3a2a13;
    }
    .container {
      text-align: center;
      padding: 2.5rem 2rem;
      background: rgba(255, 255, 255, 0.13);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px rgba(60, 40, 10, 0.13);
      max-width: 480px;
      width: 95%;
      margin: 0;
    }
    h1 {
      color: #b2ebf2;
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }
    p {
      font-size: 18px;
      color: #333;
      margin-bottom: 1.5rem;
    }
    a {
      color: #1a73e8;
      text-decoration: none;
      font-size: 1.1rem;
    }
    a:hover {
      text-decoration: underline;
    }
    .bitmap-gif {
      margin-top: 32px;
      max-width: 320px;
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .center-vertical {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .loading {
      display: block;
    }
    .error {
      display: none;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 2s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="center-vertical">
    <div class="container">
      <!-- Loading state -->
      <div id="loading-content" class="loading">
        <h1>Redirecting...</h1>
        <div class="spinner"></div>
        <p>Looking up .bitmap address...</p>
      </div>
      
      <!-- Error state -->
      <div id="error-content" class="error">
        <h1 id="error-title">Error: Name not found</h1>
        <p id="error-message">Name not found for the provided .bitmap address.</p>
        <p>Please check the input and try again. Ensure you enter the URL as <code>http://youraddress.bitmap</code> in the address bar.</p>
      </div>
    </div>
    <img class="bitmap-gif" src="https://memedepot.com/cdn-cgi/imagedelivery/naCPMwxXX46-hrE49eZovw/4394fcf0-dd82-4ab8-a30e-30e928eabb00/public" alt="Bitmap Meme GIF" />
  </div>
  
  <!-- Include all necessary scripts -->
  <script src="../lib/constants.js"></script>
  <script src="../lib/parser.js"></script>
  <script src="../lib/api.js"></script>
  <script src="error.js"></script>
</body>
</html>
